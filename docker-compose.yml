services:
  backend:
    build: ${BUILD}
    ports:
      - ${PORTS}
    env_file: # 👈 Carga automáticamente TODAS las variables de tu archivo .env
      - ${NAME_ENVIROMENT}
    environment:
      - PORT=${PORT}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - ROLE_ADMIN_NAME=${ROLE_ADMIN_NAME}
      - ROLE_BASIC_NAME=${ROLE_BASIC_NAME}
      - ADMIN_NAME=${ADMIN_NAME}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - BASIC_NAME=${BASIC_NAME}
      - BASIC_EMAIL=${BASIC_EMAIL}
      - BASIC_PASSWORD=${BASIC_PASSWORD}
    depends_on:
      - ${DB_HOST}
    networks:
      - ${NETWORKS}

  db:
    image: ${IMAGE}
    restart: ${RESTART}
    env_file:
      - ${NAME_ENVIROMENT}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${PORTS}
    volumes:
      - ${VOLUMES}
    networks:
      - ${NETWORKS}

networks:
  ${NETWORKS}:
    driver: ${DRIVER}

volumes:
  mariadb_data: