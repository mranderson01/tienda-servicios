<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pentesting Cloud Store</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #0f172a;
        color: #f8fafc;
      }
      h1,
      h2 {
        color: #38bdf8;
        text-align: center;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
      }
      .card {
        background: #1e293b;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #334155;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      }
      .price {
        color: #4ade80;
        font-size: 1.25rem;
        font-weight: bold;
      }
      form {
        background: #1e293b;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #334155;
        max-width: 400px;
        margin: 0 auto;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        color: #94a3b8;
      }
      input {
        width: 100%;
        padding: 10px;
        border-radius: 4px;
        border: 1px solid #475569;
        background: #0f172a;
        color: white;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #0284c7;
        color: white;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
      }
      button:hover {
        background-color: #0369a1;
      }
      .alert {
        padding: 10px;
        margin-top: 15px;
        border-radius: 4px;
        display: none;
        text-align: center;
      }
      .alert-success {
        background: #166534;
        color: #bbf7d0;
      }
      .alert-error {
        background: #991b1b;
        color: #fecaca;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🛡️ Tienda de Servicios de Pentesting</h1>

      <h2>Catálogo de Servicios</h2>
      <div id="services-container" class="card-grid">
        <p style="text-align: center; grid-column: 1/-1">
          Cargando catálogo...
        </p>
      </div>

      <h2>Registro de Clientes</h2>
      <form id="register-form">
        <div class="form-group">
          <label for="email">Correo Electrónico:</label>
          <input
            type="email"
            id="email"
            required
            placeholder="cliente@empresa.com"
          />
        </div>
        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input
            type="password"
            id="password"
            required
            placeholder="••••••••••••"
          />
        </div>
        <button type="submit">Crear Cuenta Segura</button>
        <div id="status-msg" class="alert"></div>
      </form>
    </div>

    <script>
      const API_URL = "http://localhost:3000/api/v1";

      // 1. Carga Asíncrona del Catálogo (GET /services)
      async function fetchServices() {
        try {
          const response = await fetch(`${API_URL}/services`);
          const result = await response.json();
          const container = document.getElementById("services-container");
          container.innerHTML = "";

          result.data.forEach((service) => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
            <h3>${service.name}</h3>
            <p>Tiempo de auditoría: <strong>${service.time}</strong></p>
            <p class="price">${service.price} €</p>
          `;
            container.appendChild(card);
          });
        } catch (err) {
          document.getElementById("services-container").innerHTML =
            '<p style="color: #ef4444; text-align: center;">Error al conectar con la API de servicios.</p>';
        }
      }

      // 2. Registro de Clientes en MariaDB via API (POST /register)
      document
        .getElementById("register-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const alertBox = document.getElementById("status-msg");

          try {
            const response = await fetch(`${API_URL}/register`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });
            const data = await response.json();

            alertBox.style.display = "block";
            if (response.ok) {
              alertBox.className = "alert alert-success";
              alertBox.innerText = `¡Registro correcto! ID de Usuario: ${data.userId}`;
              document.getElementById("register-form").reset();
            } else {
              alertBox.className = "alert alert-error";
              alertBox.innerText = data.message || "Error en el registro";
            }
          } catch (error) {
            alertBox.style.display = "block";
            alertBox.className = "alert alert-error";
            alertBox.innerText = "Error de conexión con el servidor.";
          }
        });

      fetchServices();
    </script>
  </body>
</html>
