<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda de Servicios de Pentesting</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #0d1b2a;
        color: #e0e1dd;
        margin: 0;
        padding: 0;
      }
      header {
        background-color: #1b263b;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #415a77;
      }
      .logo {
        font-size: 1.5rem;
        font-weight: bold;
        color: #778da9;
      }
      .auth-buttons a,
      .logout-btn {
        color: #ffffff;
        background-color: #0077b6;
        padding: 8px 16px;
        text-decoration: none;
        border-radius: 4px;
        font-weight: bold;
        margin-left: 10px;
        border: none;
        cursor: pointer;
      }
      .auth-buttons a:hover,
      .logout-btn:hover {
        background-color: #0096c7;
      }
      .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
      }
      .service-card {
        background-color: #1b263b;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 15px;
        border-left: 5px solid #00b4d8;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">🛡️ Pentesting Cloud Store</div>

      <!-- Estado 1: Usuario NO autenticado -->
      <div id="nav-guest" class="auth-buttons">
        <a href="login.html">Iniciar Sesión</a>
        <a href="register.html">Registrarse</a>
      </div>

      <!-- Estado 2: Usuario Autenticado -->
      <div id="nav-user" class="auth-buttons hidden">
        <span>Bienvenido, <b id="user-display"></b></span>
        <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
      </div>
    </header>

    <div class="container">
      <h1>Catálogo de Servicios de Auditoría de Seguridad</h1>
      <p>
        Servicios de seguridad informática y evaluación de vulnerabilidades.
      </p>

      <div id="services-container">
        <!-- Los servicios se cargan dinámicamente -->
      </div>
    </div>

    <script>
      const API_URL = "http://localhost:3000/api/v1";

      document.addEventListener("DOMContentLoaded", () => {
        const token = localStorage.getItem("jwt_token");
        const email = localStorage.getItem("user_email");

        if (token && email) {
          document.getElementById("nav-guest").classList.add("hidden");
          document.getElementById("nav-user").classList.remove("hidden");
          document.getElementById("user-display").innerText = email;
        }

        fetchServices();
      });

      async function fetchServices() {
        const container = document.getElementById("services-container");
        container.innerHTML =
          "<p><i>Cargando catálogo de cursos y auditorías...</i></p>";

        try {
          const res = await fetch("http://localhost:3000/api/v1/services");

          if (!res.ok) {
            throw new Error(
              `Error en el servidor backend (Status: ${res.status})`,
            );
          }

          const responseData = await res.json();

          // Adaptador para soportar arrays directos o dentro de responseData.data
          const services = Array.isArray(responseData)
            ? responseData
            : responseData.data || [];

          if (services.length === 0) {
            container.innerHTML =
              "<p>No hay cursos ni auditorías disponibles en este momento.</p>";
            return;
          }

          // Renderizar los elementos adaptando los nombres de las columnas
          container.innerHTML = services
            .map(
              (s) => `
          <div class="service-card">
              <h3>${escapeHTML(s.name || s.title || "Servicio de Auditoría")}</h3>
              <p>${escapeHTML(s.description || "Auditoría especializada de infraestructura y evaluación de vulnerabilidades.")}</p>
              <p>
                <b>Precio:</b> ${s.price ? s.price + " €" : "Consultar"} | 
                <b>Duración:</b> ${escapeHTML(s.time || s.duration || "A convenir")}
              </p>
          </div>
      `,
            )
            .join("");
        } catch (err) {
          console.error("Error al obtener servicios:", err);
          container.innerHTML = `
      <div style="background-color: #721c24; color: #f8d7da; padding: 15px; border-radius: 5px;">
        ❌ <b>Error al conectar con la API:</b> Comprueba que el backend en Node.js está activo y responde en el puerto 3000.
      </div>
    `;
        }
      }

      // Función de sanitización básica contra Cross-Site Scripting (XSS)
      function escapeHTML(str) {
        return String(str).replace(
          /[&<>'"]/g,
          (tag) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[tag] || tag,
        );
      }

      function logout() {
        localStorage.removeItem("jwt_token");
        localStorage.removeItem("user_email");
        window.location.reload();
      }
    </script>
  </body>
</html>
